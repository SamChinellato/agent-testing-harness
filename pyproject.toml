[project]
name = "maas-agent-demo"
version = "0.1.0"
description = "MaaS Rate-Limit Demo Agents and Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "rich>=13.9.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
agent = "maasagentharness.runner:main"
dashboard = "maasagentharness.dashboard.app:main"
probe = "maasagentharness.probe:main"
harness = "maasagentharness.scenario.cli:main"

[dependency-groups]
# Phase 0 fix #0.14: tests existed but ran under nothing — no pytest or
# pytest-asyncio dependency, so `pytest tests/` collected `async def test_*`
# functions, never awaited them, and asserted nothing.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["maasagentharness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
